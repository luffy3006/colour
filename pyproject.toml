[project]
name = "whiteboard"
version = "0.1.0"
description = "Minimalist, zero-latency scratchpad for math, notes, and diagrams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "numpy>=1.26.0",
]

[project.scripts]
whiteboard = "main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
